<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>5V5智能分组V2.1</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body{background:#020617;color:#e2e8f0}
.glass{background:rgba(15,23,42,.72);backdrop-filter:blur(16px)}
select,input{color:#000}
.lock-item{background:#1e293b;border:1px solid #334155}
.lock-item.locked{border-color:#f59e0b;background:#2d2310}
</style>
</>
<body class="min-h-screen p-6">
<div class="max-w-7xl mx-auto space-y-5">
<h1 class="text-4xl font-black">5V5 智能分组 V2.1</h1>

<div class="glass rounded-3xl p-5">
<div class="flex gap-2 flex-wrap">
<input id="playerSearch" class="rounded px-3 py-2 flex-1" placeholder="搜索玩家">
<button id="allBtn" class="bg-emerald-300 text-black px-3 rounded">全选</button>
<button id="noneBtn" class="bg-yellow-300 text-black px-3 rounded">取消</button>
<button id="reverseBtn" class="bg-sky-300 text-black px-3 rounded">反选</button>
</div>
<div id="playerPool" class="grid md:grid-cols-5 gap-2 mt-3"></div>

<div class="mt-4 flex flex-wrap gap-4">
<label><input type="radio" name="mode" value="fun"> 神将</label>
<label><input type="radio" name="mode" value="serious"> 红温</label>
<label><input type="radio" name="mode" value="random" checked> 普通40-60%</label>
<label><input type="radio" name="mode" value="trueRandom"> 真随机</label>
</div>

<!-- 位置锁定区 -->
<div class="mt-4 border-t border-white/10 pt-4">
  <div class="flex items-center justify-between mb-2">
    <h3 class="font-bold text-lg">位置锁定（可选，每个位置最多2人）</h3>
    <button id="clearLockBtn" class="bg-rose-300 text-black px-3 py-1 rounded text-sm">清空锁定</button>
  </div>
  <div id="lockSection" class="grid md:grid-cols-5 gap-2"></div>
  <div id="lockError" class="text-red-300 mt-2 text-sm"></div>
</div>

<button id="runBtn" class="mt-4 bg-emerald-300 text-black px-5 py-2 rounded font-bold">开始分组</button>
<div id="error" class="text-red-300 mt-2"></div>
</div>

<div class="grid lg:grid-cols-2 gap-4">
<div class="glass rounded-3xl p-5"><h2 class="font-black text-2xl">蓝队</h2><div id="blue"></div></div>
<div class="glass rounded-3xl p-5"><h2 class="font-black text-2xl">红队</h2><div id="red"></div></div>
</div>
</div>

<script>

  {name:"亚非王", lanes:{上路:"夯",打野:"顶级",中路:"顶级",下路:"人上人",辅助:"NPC"}},

  {name:"大小眼", lanes:{上路:"人上人",打野:"夯",中路:"顶级",下路:"夯",辅助:"人上人"}},
  {name:"两败俱伤", lanes:{上路:"拉完了",打野:"拉完了",中路:"人机",下路:"拉完了",辅助:"拉完了"}},
  {name:"徐凤年", lanes:{上路:"NPC",打野:"人上人",中路:"NPC",下路:"人上人",辅助:"顶级"}},

  {name:"喜丶悦", lanes:{上路:"NPC",打野:"人上人",中路:"人上人",下路:"人上人",辅助:"NPC"}},
  {name:"苏神", lanes:{上路:"人上人",打野:"人上人",中路:"顶级",下路:"NPC",辅助:"拉完了"}},
  {name:"小柠檬", lanes:{上路:"NPC",打野:"拉完了",中路:"NPC",下路:"顶级",辅助:"NPC"}},
  {name:"ztt", lanes:{上路:"NPC",打野:"NPC",中路:"顶级",下路:"NPC",辅助:"NPC"}},
  {name:"韩国飞行员", lanes:{上路:"人上人",打野:"顶级",中路:"顶级",下路:"夯",辅助:"人上人"}},
  {name:"对抗路c", lanes:{上路:"夯",打野:"NPC",中路:"NPC",下路:"NPC",辅助:"NPC"}},
  {name:"过江鱼", lanes:{上路:"NPC",打野:"顶级",中路:"拉完了",下路:"NPC",辅助:"NPC"}},
  {name:"杨子哥", lanes:{上路:"拉完了",打野:"人上人",中路:"NPC",下路:"人上人",辅助:"人上人"}},
  {name:"双大哥", lanes:{上路:"顶级",打野:"顶级",中路:"人上人",下路:"NPC",辅助:"顶级"}},
  {name:"鱼玄机", lanes:{上路:"顶级",打野:"夯",中路:"顶级",下路:"人上人",辅助:"人上人"}},
  {name:"辉子", lanes:{上路:"拉完了",打野:"NPC",中路:"拉完了",下路:"拉完了",辅助:"NPC"}},
  {name:"友人A", lanes:{上路:"NPC",打野:"NPC",中路:"NPC",下路:"人上人",辅助:"顶级"}},
  {name:"小碗儿凶巴巴", lanes:{上路:"顶级",打野:"夯爆了",中路:"顶级",下路:"夯爆了",辅助:"顶级"}},
  {name:"爱的日记", lanes:{上路:"顶级",打野:"夯爆了",中路:"夯爆了",下路:"夯",辅助:"夯"}},
  {name:"hp", lanes:{上路:"顶级",打野:"顶级",中路:"顶级",下路:"夯爆了",辅助:"人上人"}},
  {name:"元台", lanes:{上路:"顶级",打野:"NPC",中路:"NPC",下路:"NPC",辅助:"NPC"}},     
  {name:"ex", lanes:{上路:"夯",打野:"夯爆了",中路:"夯",下路:"夯",辅助:"夯"}},
  {name:"董大", lanes:{上路:"人机",打野:"人机",中路:"人机",下路:"人机",辅助:"拉完了"}},
  {name:"我还木有想好", lanes:{上路:"NPC",打野:"拉完了",中路:"人上人",下路:"NPC",辅助:"人上人"}},
  {name:"老朱", lanes:{上路:"顶级",打野:"NPC",中路:"人上人",下路:"人上人",辅助:"拉完了"}},
  {name:"小青", lanes:{上路:"拉完了",打野:"NPC",中路:"拉完了",下路:"NPC",辅助:"顶级"}},
  {name:"狗叫", lanes:{上路:"夯",打野:"夯",中路:"顶级",下路:"人上人",辅助:"人上人"}},
  {name:"热河路", lanes:{上路:"人上人",打野:"顶级",中路:"顶级",下路:"夯",辅助:"人上人"}},
  {name:"羊羊", lanes:{上路:"NPC",打野:"人上人",中路:"顶级",下路:"NPC",辅助:"NPC"}},
  {name:"青莲剑歌", lanes:{上路:"人上人",打野:"NPC",中路:"人上人",下路:"人上人",辅助:"人上人"}},
  {name:"西安王", lanes:{上路:"顶级",打野:"NPC",中路:"人上人",下路:"人上人",辅助:"拉完了"}},
  {name:"嘉豪", lanes:{上路:"人上人",打野:"顶级",中路:"顶级",下路:"夯",辅助:"人上人"}},
];

const SCORE={
"夯爆了":260,"夯":210,"顶级":170,"人上人":130,"NPC":90,"拉完了":50,"人机":10
};

const FUN={
"夯爆了":10,"夯":50,"顶级":90,"人上人":130,"NPC":170,"拉完了":210,"人机":260
};

const LANE_WEIGHT={
"上路":0.95,
"打野":1.2,
"中路":1.1,
"下路":1.0,
"辅助":0.9
};

const LANES=["上路","打野","中路","下路","辅助"];

const $=id=>document.getElementById(id);

function shuffle(a){
a=[...a];
for(let i=a.length-1;i>0;i--){
let j=Math.floor(Math.random()*(i+1));
[a[i],a[j]]=[a[j],a[i]];
}
return a;
}

function renderPool(){
playerPool.innerHTML=PLAYERS.map(p=>`
<label class="bg-slate-800 rounded p-2 playerItem">
<input type="checkbox" value="${p.name}">
${p.name}
</label>`).join("");
// 选中状态变化时重建锁定UI
document.querySelectorAll("#playerPool input").forEach(c=>{
c.addEventListener("change",buildLockUI);
});
}

function selected(){
return [...document.querySelectorAll("#playerPool input:checked")]
.map(v=>PLAYERS.find(x=>x.name===v.value));
}

function score(player,lane,mode){
let lv=player.lanes[lane];
let base=mode=="fun"?FUN[lv]:SCORE[lv];
return base*LANE_WEIGHT[lane];
}

/* === 位置锁定相关 === */
function buildLockUI(){
const ps=selected();
const lockDiv=$("lockSection");
if(ps.length===0){
lockDiv.innerHTML="<p class='text-slate-400 text-sm'>请先选择玩家</p>";
return;
}
// 保留之前已选择的锁定
const prev={};
document.querySelectorAll(".lockSelect").forEach(s=>{
if(s.value) prev[s.dataset.player]=s.value;
});
lockDiv.innerHTML=ps.map(p=>{
const cur=prev[p.name]||"";
return `<label class="lock-item ${cur?'locked':''} rounded p-2 flex items-center gap-2">
<span class="flex-1 truncate">${p.name}</span>
<select class="lockSelect rounded px-2 py-1 text-sm" data-player="${p.name}">
<option value="">不指定</option>
${LANES.map(l=>`<option value="${l}" ${cur===l?'selected':''}>${l}</option>`).join("")}
</select>
</label>`;
}).join("");
// 切换锁定样式
document.querySelectorAll(".lockSelect").forEach(s=>{
s.addEventListener("change",e=>{
const label=e.target.closest(".lock-item");
if(e.target.value) label.classList.add("locked");
else label.classList.remove("locked");
validateLocksUI();
});
});
validateLocksUI();
}

function getLocks(){
const locks={};
document.querySelectorAll(".lockSelect").forEach(sel=>{
if(sel.value) locks[sel.dataset.player]=sel.value;
});
return locks;
}

function validateLocks(locks){
const cnt={};
for(const lane of Object.values(locks)){
cnt[lane]=(cnt[lane]||0)+1;
if(cnt[lane]>2) return `位置[${lane}]锁定超过2人，每个位置最多2人`;
}
return null;
}

function validateLocksUI(){
const err=validateLocks(getLocks());
$("lockError").textContent=err||"";
}

/* === 分队：尊重锁定 === */
function splitTeamsWithLocks(ps,locks){
const laneLocked={};
LANES.forEach(l=>laneLocked[l]=[]);
const unlocked=[];
ps.forEach(p=>{
if(locks[p.name]) laneLocked[locks[p.name]].push(p);
else unlocked.push(p);
});

const blue=[];
const red=[];
const blueLocks={};
const redLocks={};

// 同位置锁2人：强制分到不同队
for(const lane of LANES){
if(laneLocked[lane].length===2){
const [a,b]=laneLocked[lane];
if(Math.random()<0.5){
blue.push(a); blueLocks[a.name]=lane;
red.push(b); redLocks[b.name]=lane;
}else{
blue.push(b); blueLocks[b.name]=lane;
red.push(a); redLocks[a.name]=lane;
}
}
}

// 同位置锁1人：随机分到一队
for(const lane of LANES){
if(laneLocked[lane].length===1){
const p=laneLocked[lane][0];
const canBlue=blue.length<5;
const canRed=red.length<5;
if(canBlue&&canRed){
if(Math.random()<0.5){ blue.push(p); blueLocks[p.name]=lane; }
else{ red.push(p); redLocks[p.name]=lane; }
}else if(canBlue){ blue.push(p); blueLocks[p.name]=lane; }
else{ red.push(p); redLocks[p.name]=lane; }
}
}

// 用未锁定玩家补满
const rem=shuffle(unlocked);
let idx=0;
while(blue.length<5) blue.push(rem[idx++]);
while(red.length<5) red.push(rem[idx++]);

return {blue,red,blueLocks,redLocks};
}

/* === 分配位置：尊重锁定 === */
function assignWithLocks(team,locks,mode,full){
// 已锁定的玩家直接放到对应位置
const lockedMap={};
const usedLanes=new Set();
team.forEach(p=>{
if(locks[p.name]){
lockedMap[p.name]=locks[p.name];
usedLanes.add(locks[p.name]);
}
});

const unlockedMembers=team.filter(p=>!locks[p.name]);
const availableLanes=LANES.filter(l=>!usedLanes.has(l));

// 全部锁定
if(unlockedMembers.length===0){
let total=0;
team.forEach(p=>{
const lane=lockedMap[p.name];
total+=full?Math.random()*300:score(p,lane,mode);
});
return {map:lockedMap,total};
}

let best=null;
function dfs(i,used,map,total){
if(i===unlockedMembers.length){
if(!best||total>best.total) best={map:{...map},total};
return;
}
const p=unlockedMembers[i];
for(const lane of availableLanes){
if(used.has(lane)) continue;
used.add(lane);
map[p.name]=lane;
dfs(i+1,used,map,total+(full?Math.random()*300:score(p,lane,mode)));
used.delete(lane);
delete map[p.name];
}
}
dfs(0,new Set(),{...lockedMap},0);
return best;
}

function calc(team,map){
return team.reduce((s,p)=>{
let lane=map[p.name];
return s+SCORE[p.lanes[lane]]*LANE_WEIGHT[lane];
},0);
}

function win(diff){
return 100/(1+Math.exp(-diff/140));
}

function render(team,map,total,id,locks){
$(id).innerHTML=LANES.map(l=>{
let p=team.find(x=>map[x.name]==l);
let lv=p.lanes[l];
const lockMark=(locks&&locks[p.name])?"🔒":"";
return `<div class="flex justify-between py-1 border-b border-white/10">
<span>${l}:${p.name} ${lockMark}</span>
<span>${lv}</span>
</div>`;
}).join("")+`<div class="mt-3 font-bold">总分:${total.toFixed(1)}</div>`;
}

runBtn.onclick=()=>{
error.textContent="";
let ps=selected();
if(ps.length!=10){
error.textContent="请选择10人";
return;
}
const locks=getLocks();
const lockErr=validateLocks(locks);
if(lockErr){
error.textContent=lockErr;
return;
}

let mode=document.querySelector("input[name=mode]:checked").value;

if(mode=="trueRandom"){
// 真随机也尊重锁定
let best=null;
for(let i=0;i<500;i++){
const {blue,red,blueLocks,redLocks}=splitTeamsWithLocks(ps,locks);
const ba=assignWithLocks(blue,blueLocks,mode,true);
const ra=assignWithLocks(red,redLocks,mode,true);
const bt=calc(blue,ba.map);
const rt=calc(red,ra.map);
const diff=Math.abs(bt-rt);
if(!best||diff<best.diff){
best={blue,red,ba,ra,bt,rt,blueLocks,redLocks};
}
}
if(!best){
error.textContent="分配失败，请检查锁定设置";
return;
}
showResult(best);
return;
}

let best=null;
const TRIES=2500;
let validCount=0;

for(let i=0;i<TRIES;i++){
const {blue,red,blueLocks,redLocks}=splitTeamsWithLocks(ps,locks);

const ba=assignWithLocks(blue,blueLocks,mode,mode=="random");
const ra=assignWithLocks(red,redLocks,mode,mode=="random");
if(!ba||!ra) continue;

const bt=calc(blue,ba.map);
const rt=calc(red,ra.map);
const wr=win(bt-rt);

if(mode=="random"){
if(wr<43||wr>57) continue;
}

validCount++;
const diff=Math.abs(bt-rt);

if(!best||diff<best.diff){
best={blue,red,ba,ra,bt,rt,blueLocks,redLocks};
}
}

if(!best){
error.textContent="没有找到满足条件的分组，可重新尝试或减少锁定";
return;
}

showResult(best);
};

function showResult(best){
render(best.blue,best.ba.map,best.bt,"blue",best.blueLocks);
render(best.red,best.ra.map,best.rt,"red",best.redLocks);
let b=win(best.bt-best.rt);
blue.innerHTML+=`<div class="text-cyan-300 font-bold mt-3">胜率:${b.toFixed(1)}%</div>`;
red.innerHTML+=`<div class="text-pink-300 font-bold mt-3">胜率:${(100-b).toFixed(1)}%</div>`;
}

playerSearch.oninput=e=>{
let k=e.target.value.toLowerCase();
document.querySelectorAll(".playerItem").forEach(x=>{
x.style.display=x.innerText.toLowerCase().includes(k)?"block":"none";
});
};

allBtn.onclick=()=>{document.querySelectorAll("#playerPool input").forEach(x=>x.checked=true);buildLockUI();};
noneBtn.onclick=()=>{document.querySelectorAll("#playerPool input").forEach(x=>x.checked=false);buildLockUI();};
reverseBtn.onclick=()=>{document.querySelectorAll("#playerPool input").forEach(x=>x.checked=!x.checked);buildLockUI();};

clearLockBtn.onclick=()=>{
document.querySelectorAll(".lockSelect").forEach(s=>{
s.value="";
s.closest(".lock-item").classList.remove("locked");
});
validateLocksUI();
};

renderPool();
buildLockUI();
</script>
</body>
