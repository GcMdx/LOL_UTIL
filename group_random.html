<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>5V5 智能分组 + 胜率预测</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body{background:#020617;color:#e2e8f0}
.glass{background:rgba(15,23,42,.72);backdrop-filter:blur(16px)}
select{color:#000 !important;}
</style>
</head>
<body class="min-h-screen p-6">
<div class="max-w-7xl mx-auto space-y-6">

<h1 class="text-4xl font-black">5V5 智能分组 + 胜率预测</h1>
<div class="mt-4">
        <a href="hero_random.html" class="inline-flex items-center gap-2 rounded-full border border-emerald-300/35 bg-emerald-300/10 px-4 py-2 text-sm font-bold text-emerald-100 hover:bg-emerald-300/20 transition">
          前往分组随机子页面
        </a>
      </div>
<div class="glass rounded-3xl p-5 space-y-3 text-sm leading-relaxed">
<p class="text-lg font-black">系统说明</p>
<p><b>评分体系：从夯到拉</b></p>
<p><b>模式：</b>娱乐 / 认真 / 全随机 / 真全随机</p>
<p><b>规则：</b>恩怨局前三个模式会尽量配平</p>
<p><b>说明：</b>真全随机模式完全不考虑评分与平衡，纯随机分组与位置</p>
</div>

<div class="glass rounded-3xl p-5 space-y-4">

<div>
<label class="font-bold">选择 10 人</label>
<div id="playerPool" class="grid md:grid-cols-5 gap-2 mt-2"></div>
</div>

<div class="flex flex-wrap gap-6">
<label><input type="radio" name="mode" value="fun"> 神将模式（选的都是不会的位置🤡）</label>
<label><input type="radio" name="mode" value="serious"> 红温模式（选的都是会的位置🔴）</label>
<label><input type="radio" name="mode" value="random" checked> 普通模式（尽量公平的随机⚖️）</label>
<label><input type="radio" name="mode" value="trueRandom"> 真全随机模式（瞎几把乱选💥）</label>
</div>

<div>
<h2 class="font-bold mb-2">恩怨组</h2>
<div id="enemyRows"></div>
<button id="addEnemy" class="mt-2 px-4 py-2 rounded bg-rose-300 text-slate-950 font-bold">添加恩怨</button>
</div>

<button id="runBtn" class="px-6 py-3 rounded bg-emerald-300 text-slate-950 font-black">开始分组</button>
<div id="error" class="text-rose-300"></div>
</div>

<div class="grid lg:grid-cols-2 gap-4">
<div class="glass rounded-3xl p-5"><h2 class="text-2xl font-black mb-4">蓝队</h2><div id="blue"></div></div>
<div class="glass rounded-3xl p-5"><h2 class="text-2xl font-black mb-4">红队</h2><div id="red"></div></div>
</div>

</div>

<script>
const PLAYERS = [
  {name:"后妈", lanes:{上路:"NPC",打野:"拉完了",中路:"拉完了",下路:"拉完了",辅助:"人上人"}},
  {name:"银河", lanes:{上路:"人上人",打野:"夯",中路:"人上人",下路:"夯",辅助:"顶级"}},
  {name:"经理", lanes:{上路:"拉完了",打野:"拉完了",中路:"人上人",下路:"NPC",辅助:"NPC"}},
  {name:"只是npc", lanes:{上路:"NPC",打野:"人上人",中路:"人上人",下路:"夯",辅助:"拉完了"}},
  {name:"亚非王", lanes:{上路:"夯",打野:"顶级",中路:"顶级",下路:"人上人",辅助:"NPC"}},
  {name:"小寻", lanes:{上路:"人上人",打野:"NPC",中路:"拉完了",下路:"NPC",辅助:"NPC"}},
  {name:"雄狮", lanes:{上路:"顶级",打野:"人上人",中路:"夯",下路:"NPC",辅助:"NPC"}},
  {name:"天空", lanes:{上路:"人上人",打野:"夯",中路:"夯",下路:"人上人",辅助:"人上人"}},
  {name:"阿呆", lanes:{上路:"拉完了",打野:"NPC",中路:"顶级",下路:"NPC",辅助:"顶级"}},
  {name:"小智", lanes:{上路:"NPC",打野:"人上人",中路:"顶级",下路:"人上人",辅助:"NPC"}},
  {name:"7053", lanes:{上路:"顶级",打野:"人上人",中路:"人上人",下路:"人上人",辅助:"人上人"}},
  {name:"大小眼", lanes:{上路:"NPC",打野:"夯",中路:"人上人",下路:"顶级",辅助:"NPC"}},
  {name:"两败俱伤", lanes:{上路:"拉完了",打野:"拉完了",中路:"拉完了",下路:"拉完了",辅助:"拉完了"}},
  {name:"徐凤年", lanes:{上路:"NPC",打野:"人上人",中路:"人上人",下路:"人上人",辅助:"顶级"}},
  {name:"小梅", lanes:{上路:"拉完了",打野:"拉完了",中路:"NPC",下路:"拉完了",辅助:"NPC"}},
  {name:"喜丶悦", lanes:{上路:"NPC",打野:"人上人",中路:"人上人",下路:"人上人",辅助:"NPC"}},
  {name:"苏神", lanes:{上路:"人上人",打野:"人上人",中路:"顶级",下路:"NPC",辅助:"拉完了"}},
  {name:"小柠檬", lanes:{上路:"NPC",打野:"拉完了",中路:"NPC",下路:"顶级",辅助:"NPC"}},
  {name:"ztt", lanes:{上路:"NPC",打野:"NPC",中路:"顶级",下路:"NPC",辅助:"NPC"}},
  {name:"韩国飞行员", lanes:{上路:"人上人",打野:"NPC",中路:"人上人",下路:"夯",辅助:"人上人"}},
  {name:"对抗路c", lanes:{上路:"夯",打野:"NPC",中路:"NPC",下路:"NPC",辅助:"NPC"}},
  {name:"过江鱼", lanes:{上路:"NPC",打野:"顶级",中路:"NPC",下路:"NPC",辅助:"NPC"}},
  {name:"杨子哥", lanes:{上路:"拉完了",打野:"人上人",中路:"NPC",下路:"顶级",辅助:"人上人"}},
  {name:"双大哥", lanes:{上路:"顶级",打野:"顶级",中路:"人上人",下路:"NPC",辅助:"顶级"}},
  {name:"鱼玄机", lanes:{上路:"NPC",打野:"夯",中路:"NPC",下路:"顶级",辅助:"人上人"}},
  {name:"辉子", lanes:{上路:"拉完了",打野:"NPC",中路:"拉完了",下路:"拉完了",辅助:"拉完了"}},
  {name:"友人A", lanes:{上路:"NPC",打野:"NPC",中路:"NPC",下路:"人上人",辅助:"顶级"}},
  {name:"我还木有想好", lanes:{上路:"NPC",打野:"拉完了",中路:"人上人",下路:"NPC",辅助:"人上人"}}
];

const SCORE={夯:200,顶级:155,人上人:110,NPC:65,拉完了:20};
const FUN_WEIGHT={夯:20,顶级:65,人上人:110,NPC:155,拉完了:200};
const LANES=['上路','打野','中路','下路','辅助'];
const $=id=>document.getElementById(id);

function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function renderPool(){
$('playerPool').innerHTML=PLAYERS.map(p=>`<label class='rounded bg-slate-800 p-2'><input type='checkbox' value='${p.name}'> ${p.name}</label>`).join('')
}

function addEnemyRow(){
const row=document.createElement('div');
row.className='grid grid-cols-4 gap-2 mt-2';
const opts=PLAYERS.map(p=>`<option>${p.name}</option>`).join('');
const lanes=LANES.map(x=>`<option>${x}</option>`).join('');
row.innerHTML=`<select class='a'>${opts}</select><select class='b'>${opts}</select><select class='lane'>${lanes}</select><button onclick="this.parentElement.remove()" class="bg-white text-black rounded px-2">删除</button>`;
$('enemyRows').appendChild(row)
}

function selected(){
return [...document.querySelectorAll('#playerPool input:checked')].map(x=>PLAYERS.find(p=>p.name===x.value));
}

function getScore(p,l){return SCORE[p.lanes[l]];}
function getWeight(p,l,mode){return mode==='fun'?FUN_WEIGHT[p.lanes[l]]:SCORE[p.lanes[l]];}
function isEnemy(p,enemies){return enemies.some(e=>e.a===p.name||e.b===p.name);}
function calc(team,map){return team.reduce((s,p)=>s+getScore(p,map[p.name]),0)}

function assign(team,mode,enemies,fullRandom){
let best=null;
function dfs(i,used,map,total){
if(i===team.length){if(!best||total>best.total)best={map:{...map},total};return}
const p=team[i];
for(const lane of LANES){
if(used.has(lane))continue;

if(fullRandom){
used.add(lane);
map[p.name]=lane;
dfs(i+1,used,map,total+Math.random()*200);
used.delete(lane);
delete map[p.name];
continue;
}

const e=enemies.find(x=>x.a===p.name||x.b===p.name);
if(e&&e.lane!==lane)continue;

used.add(lane);
map[p.name]=lane;
dfs(i+1,used,map,total+getWeight(p,lane,mode));
used.delete(lane);
delete map[p.name];
}
}
dfs(0,new Set(),{},0);
return best;
}

function winRate(diff){ return 100 / (1 + Math.exp(-diff / 120));}

function run(){
$('error').textContent='';
const players=selected();
if(players.length!==10){$('error').textContent='请选择10人';return}
const enemies=[...document.querySelectorAll('#enemyRows > div')].map(r=>({a:r.querySelector('.a').value,b:r.querySelector('.b').value,lane:r.querySelector('.lane').value}));
const mode=document.querySelector('input[name=mode]:checked').value;

// 🔥 真全随机模式
if(mode==='trueRandom'){
  const s = shuffle(players);
  const blue = s.slice(0,5);
  const red = s.slice(5);

  function randMap(team){
    const lanes = [...LANES];
    const map = {};
    for(const p of team){
      const idx = Math.floor(Math.random()*lanes.length);
      map[p.name] = lanes.splice(idx,1)[0];
    }
    return map;
  }

  const ba = { map: randMap(blue) };
  const ra = { map: randMap(red) };

  const blueTotal = calc(blue, ba.map);
  const redTotal = calc(red, ra.map);

  const diff = blueTotal - redTotal;

  render({
    blue, red,
    ba, ra,
    blueTotal,
    redTotal,
    diff
  });

  return;
}

const fullRandom=mode==='random';

let best=null;
for(let i=0;i<300;i++){
const s=shuffle(players);
const blue=s.slice(0,5),red=s.slice(5);

const ba=assign(blue,mode,enemies,fullRandom);
const ra=assign(red,mode,enemies,fullRandom);
if(!ba||!ra)continue;

const blueTotal=calc(blue,ba.map);
const redTotal=calc(red,ra.map);

const diff=blueTotal-redTotal;
const score=Math.abs(diff);
if(!best||score<best.score)best={blue,red,ba,ra,blueTotal,redTotal,diff,score};
}

if(!best){$('error').textContent='无解';return}
render(best);
}

function render(res){
function block(team,map,total){
return LANES.map(l=>{
const p=team.find(x=>map[x.name]===l);
const laneScore=p.lanes[l];
const score=SCORE[laneScore];
return `<div class='flex justify-between border-b border-white/10 py-1'>
<div>${l}：${p.name}</div>
<div class='text-right text-xs'>${laneScore} / ${score}</div>
</div>`;
}).join('')+`<div class='font-black mt-3'>总分：${total.toFixed(1)}</div>`;
}

const blueWR=winRate(res.diff);
const redWR=100-blueWR;

$('blue').innerHTML=block(res.blue,res.ba.map,res.blueTotal)+`<div class='text-cyan-300 font-black'>胜率：${blueWR.toFixed(1)}%</div>`;
$('red').innerHTML=block(res.red,res.ra.map,res.redTotal)+`<div class='text-pink-300 font-black'>胜率：${redWR.toFixed(1)}%</div>`;
}

renderPool();
$('addEnemy').onclick=addEnemyRow;
$('runBtn').onclick=run;
</script>
</body>
</html>
