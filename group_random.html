```html
<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>5V5 约束求解随机分组</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      background:
        radial-gradient(circle at 15% 10%, rgba(59,130,246,.18), transparent 25%),
        radial-gradient(circle at 85% 15%, rgba(236,72,153,.16), transparent 25%),
        radial-gradient(circle at 50% 100%, rgba(16,185,129,.14), transparent 35%),
        #020617;
    }

    .glass {
      background: rgba(15,23,42,.72);
      backdrop-filter: blur(18px);
    }

    .card {
      transition: .2s ease;
    }

    .card:hover {
      transform: translateY(-2px);
    }
  </style>
</head>
<body class="min-h-screen text-slate-100">

<div class="max-w-7xl mx-auto px-4 py-8">

  <header class="text-center mb-8">
    <h1 class="text-5xl font-black bg-gradient-to-r from-cyan-200 via-emerald-200 to-pink-200 bg-clip-text text-transparent">
      5V5 约束求解随机分组
    </h1>

    <p class="text-slate-300 mt-4">
      真正 CSP 约束求解 · 无解检测 · 幻神/恩怨勾选式配置
    </p>
  </header>

  <section class="glass border border-white/10 rounded-3xl p-5 mb-6">

    <label class="block text-sm font-bold mb-2">
      玩家名单
    </label>

    <textarea
      id="playersInput"
      rows="5"
      class="w-full rounded-2xl bg-slate-950/70 border border-white/10 p-3 outline-none focus:ring-2 focus:ring-cyan-300"
      placeholder="每行一个玩家"
    ></textarea>

    <div class="flex gap-3 mt-4 flex-wrap">
      <button
        id="loadPlayersBtn"
        class="px-5 py-3 rounded-2xl bg-cyan-300 text-slate-950 font-black hover:brightness-110"
      >
        加载玩家
      </button>

      <button
        id="solveBtn"
        class="px-5 py-3 rounded-2xl bg-emerald-300 text-slate-950 font-black hover:brightness-110"
      >
        开始求解
      </button>
    </div>

  </section>

  <section
    id="playerConfigSection"
    class="hidden glass border border-white/10 rounded-3xl p-5 mb-6"
  >

    <div class="flex items-center justify-between mb-4">
      <h2 class="text-2xl font-black">玩家配置</h2>

      <button
        id="addEnemyBtn"
        class="px-4 py-2 rounded-xl bg-rose-300 text-slate-950 font-bold"
      >
        添加恩怨组
      </button>
    </div>

    <div id="playersConfig" class="space-y-4"></div>

    <div class="mt-8">
      <h3 class="text-xl font-black mb-3 text-rose-200">
        恩怨组
      </h3>

      <div id="enemyContainer" class="space-y-3"></div>
    </div>

  </section>

  <div
    id="errorBox"
    class="hidden mb-6 rounded-2xl border border-rose-300/30 bg-rose-900/30 px-4 py-3 text-rose-100"
  ></div>

  <main class="grid grid-cols-1 lg:grid-cols-2 gap-5">

    <section class="card rounded-3xl border border-blue-300/20 bg-blue-950/20 overflow-hidden">

      <div class="p-5 border-b border-blue-300/20 bg-blue-600/20">
        <h2 class="text-3xl font-black">蓝色方</h2>
      </div>

      <div id="blueTeam" class="p-5"></div>

    </section>

    <section class="card rounded-3xl border border-red-300/20 bg-red-950/20 overflow-hidden">

      <div class="p-5 border-b border-red-300/20 bg-red-600/20">
        <h2 class="text-3xl font-black">红色方</h2>
      </div>

      <div id="redTeam" class="p-5"></div>

    </section>

  </main>

</div>

<script>

const LANES = ["上路", "打野", "中路", "下路", "辅助"];

const $ = id => document.getElementById(id);

let currentPlayers = [];

function parsePlayers() {
  const raw = $("playersInput").value;

  return [...new Set(
    raw
      .split(/[\n,，、\s]+/)
      .map(x => x.trim())
      .filter(Boolean)
  )];
}

function showError(msg) {
  const box = $("errorBox");

  if (!msg) {
    box.classList.add("hidden");
    box.innerHTML = "";
    return;
  }

  box.classList.remove("hidden");
  box.innerHTML = msg;
}

function loadPlayers() {

  showError("");

  const players = parsePlayers();

  if (players.length !== 10) {
    return showError("必须正好 10 名玩家");
  }

  currentPlayers = players;

  renderPlayerConfigs();

  $("playerConfigSection").classList.remove("hidden");
}

function renderPlayerConfigs() {

  const container = $("playersConfig");

  container.innerHTML = "";

  currentPlayers.forEach(player => {

    container.insertAdjacentHTML("beforeend", `

      <div class="rounded-2xl border border-white/10 bg-slate-950/40 p-4">

        <div class="flex flex-col lg:flex-row gap-4 lg:items-center lg:justify-between">

          <div class="text-xl font-black min-w-[100px]">
            ${player}
          </div>

          <div class="flex flex-wrap gap-4">

            <label class="flex items-center gap-2 text-sm">
              <input type="checkbox" class="captain-check" data-player="${player}">
              队长
            </label>

            <label class="flex items-center gap-2 text-sm">
              <input type="checkbox" class="god-check" data-player="${player}">
              幻神
            </label>

          </div>

        </div>

        <div class="mt-4 flex flex-wrap gap-3 lane-pref" data-player="${player}">

          ${LANES.map(lane => `
            <label class="flex items-center gap-2 text-xs rounded-full border border-white/10 px-3 py-1 bg-white/5">
              <input
                type="checkbox"
                class="lane-check"
                data-player="${player}"
                value="${lane}"
              >
              ${lane}
            </label>
          `).join("")}

        </div>

      </div>

    `);
  });
}

function addEnemyRow() {

  const container = $("enemyContainer");

  const row = document.createElement("div");

  row.className = "rounded-2xl border border-rose-300/20 bg-rose-950/20 p-4";

  row.innerHTML = `

    <div class="grid grid-cols-1 md:grid-cols-4 gap-3">

      <select class="enemy-a rounded-xl bg-slate-950/70 border border-white/10 p-2">
        ${currentPlayers.map(p => `<option>${p}</option>`).join("")}
      </select>

      <select class="enemy-b rounded-xl bg-slate-950/70 border border-white/10 p-2">
        ${currentPlayers.map(p => `<option>${p}</option>`).join("")}
      </select>

      <select class="enemy-lane rounded-xl bg-slate-950/70 border border-white/10 p-2">
        ${LANES.map(l => `<option>${l}</option>`).join("")}
      </select>

      <button class="remove-enemy rounded-xl bg-rose-300 text-slate-950 font-bold">
        删除
      </button>

    </div>

  `;

  container.appendChild(row);

  row.querySelector(".remove-enemy")
    .addEventListener("click", () => row.remove());
}

function buildConfig() {

  const players = currentPlayers.map(name => {

    const captain = document.querySelector(`.captain-check[data-player="${name}"]`).checked;

    const god = document.querySelector(`.god-check[data-player="${name}"]`).checked;

    const preferredLanes = [...document.querySelectorAll(`.lane-check[data-player="${name}"]:checked`)]
      .map(x => x.value);

    return {
      name,
      captain,
      god,
      preferredLanes
    };
  });

  const captains = players.filter(x => x.captain);

  if (captains.length !== 2) {
    throw new Error("必须选择 2 名队长");
  }

  const enemyPairs = [...document.querySelectorAll("#enemyContainer > div")]
    .map(row => {

      const a = row.querySelector(".enemy-a").value;
      const b = row.querySelector(".enemy-b").value;
      const lane = row.querySelector(".enemy-lane").value;

      if (a === b) {
        throw new Error("恩怨组不能是同一个人");
      }

      return { a, b, lane };
    });

  return {
    players,
    enemyPairs
  };
}

function shuffle(arr) {
  const a = [...arr];

  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }

  return a;
}

function solveTeams(config) {

  const result = {};

  const players = [...config.players];

  const state = {
    blueCount: 0,
    redCount: 0,

    blueLanes: new Set(),
    redLanes: new Set()
  };

  const ordered = players.sort((a, b) => {

    const wa = weight(a, config);
    const wb = weight(b, config);

    return wb - wa;
  });

  function dfs(index) {

    if (index >= ordered.length) {
      return true;
    }

    const player = ordered[index];

    const teams = shuffle(["blue", "red"]);

    const lanes = getPossibleLanes(player);

    for (const team of teams) {

      for (const lane of lanes) {

        if (!canPlace(player, team, lane)) {
          continue;
        }

        place(player, team, lane);

        if (dfs(index + 1)) {
          return true;
        }

        rollback(player);
      }
    }

    return false;
  }

  function weight(player, config) {

    let w = 0;

    if (player.captain) w += 100;
    if (player.god) w += 50;

    const enemyCount = config.enemyPairs.filter(
      x => x.a === player.name || x.b === player.name
    ).length;

    w += enemyCount * 40;

    return w;
  }

  function getPossibleLanes(player) {

    if (player.preferredLanes.length > 0) {
      return shuffle(player.preferredLanes);
    }

    return shuffle(LANES);
  }

  function canPlace(player, team, lane) {

    if (team === "blue") {
      if (state.blueCount >= 5) return false;
      if (state.blueLanes.has(lane)) return false;
    }

    if (team === "red") {
      if (state.redCount >= 5) return false;
      if (state.redLanes.has(lane)) return false;
    }

    const captains = Object.entries(result)
      .filter(([_, v]) => v.captain)
      .map(([_, v]) => v.team);

    if (player.captain) {

      if (captains.includes(team)) {
        return false;
      }
    }

    for (const enemy of config.enemyPairs) {

      if (enemy.a !== player.name && enemy.b !== player.name) {
        continue;
      }

      const otherName = enemy.a === player.name
        ? enemy.b
        : enemy.a;

      const other = result[otherName];

      if (!other) {
        continue;
      }

      if (other.team === team) {
        return false;
      }

      if (lane !== enemy.lane) {
        return false;
      }

      if (other.lane !== lane) {
        return false;
      }
    }

    return true;
  }

  function place(player, team, lane) {

    result[player.name] = {
      team,
      lane,
      captain: player.captain
    };

    if (team === "blue") {
      state.blueCount++;
      state.blueLanes.add(lane);
    } else {
      state.redCount++;
      state.redLanes.add(lane);
    }
  }

  function rollback(player) {

    const placed = result[player.name];

    if (!placed) return;

    if (placed.team === "blue") {
      state.blueCount--;
      state.blueLanes.delete(placed.lane);
    } else {
      state.redCount--;
      state.redLanes.delete(placed.lane);
    }

    delete result[player.name];
  }

  const success = dfs(0);

  if (!success) {
    return null;
  }

  return result;
}

function renderResult(result) {

  const blue = [];
  const red = [];

  Object.entries(result).forEach(([name, data]) => {

    const card = `
      <div class="rounded-2xl border border-white/10 bg-slate-950/50 p-4">

        <div class="flex items-center justify-between">

          <div>
            <div class="font-black text-lg">${name}</div>
            <div class="text-sm text-slate-300 mt-1">${data.lane}</div>
          </div>

          ${data.captain
            ? `<div class="px-3 py-1 rounded-full bg-amber-300 text-slate-950 text-xs font-black">队长</div>`
            : ""
          }

        </div>

      </div>
    `;

    if (data.team === "blue") {
      blue.push(card);
    } else {
      red.push(card);
    }
  });

  $("blueTeam").innerHTML = `
    <div class="grid grid-cols-1 gap-3">
      ${blue.join("")}
    </div>
  `;

  $("redTeam").innerHTML = `
    <div class="grid grid-cols-1 gap-3">
      ${red.join("")}
    </div>
  `;
}

function solve() {

  try {

    showError("");

    const config = buildConfig();

    const result = solveTeams(config);

    if (!result) {
      return showError(`
        <div class="font-black text-lg mb-2">当前规则无合法解</div>

        <ul class="list-disc pl-5 space-y-1 text-sm">
          <li>可能有过多固定位置冲突</li>
          <li>可能恩怨组占用了相同路线</li>
          <li>可能队长/幻神约束冲突</li>
        </ul>
      `);
    }

    renderResult(result);

  } catch (err) {

    showError(err.message);
  }
}

$("loadPlayersBtn").addEventListener("click", loadPlayers);

$("solveBtn").addEventListener("click", solve);

$("addEnemyBtn").addEventListener("click", addEnemyRow);

</script>

</body>
</html>
